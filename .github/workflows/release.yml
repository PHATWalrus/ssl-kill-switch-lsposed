name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Gradle 9.1.0 and generate wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.1.0-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-9.1.0/bin/gradle wrapper
          chmod +x gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build release and debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             ssl-kill-switch-${{ github.ref_name }}.apk
          mv app/build/outputs/apk/debug/app-debug.apk \
             ssl-kill-switch-${{ github.ref_name }}-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            ssl-kill-switch-${{ github.ref_name }}.apk
            ssl-kill-switch-${{ github.ref_name }}-debug.apk
          generate_release_notes: true
